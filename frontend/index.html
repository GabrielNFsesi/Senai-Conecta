<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI Conecta</title>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo"><span class="logo-mark">S</span><span>SENAI Conecta</span></a>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Pesquisar @username..." autocomplete="off">
            <div id="searchResults"></div>
        </div>
        <div class="user-menu" id="userMenu">
            <!-- Renderizado via JS conforme estado de autenticação -->
        </div>
    </header>
 
    <main class="container">
        <section id="createPostSection" class="card hidden">
            <h3>Nova publicação</h3>
            <form id="postForm">
                <textarea id="postText" placeholder="O que você quer compartilhar?" rows="3" required></textarea>
                <div class="form-actions">
                    <input type="file" id="postImage" accept="image/*">
                    <button type="submit" class="btn primary">Publicar</button>
                </div>
            </form>
        </section>
 
        <section id="feed" class="feed-container">
            <!-- Feed renderizado dinamicamente -->
        </section>
    </main>
 
    <!-- Modal de Autenticação -->
    <div id="authModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeAuthModal()">&times;</span>
            <div class="tabs">
                <button id="tabLogin" class="tab-btn active" onclick="switchTab('login')">Login</button>
                <button id="tabRegister" class="tab-btn" onclick="switchTab('register')">Cadastrar</button>
            </div>
 
            <form id="loginForm" class="auth-form">
                <input type="email" id="loginEmail" placeholder="E-mail" required>
                <input type="password" id="loginSenha" placeholder="Senha" required>
                <div id="loginError" class="error-msg hidden"></div>
                <button type="submit" class="btn primary">Entrar</button>
            </form>
 
            <form id="registerForm" class="auth-form hidden">
                <input type="text" id="regNome" placeholder="Nome Completo" required>
                <input type="text" id="regUsername" placeholder="Nome de usuário (@username)" required>
                <input type="email" id="regEmail" placeholder="E-mail" required>
                <input type="password" id="regSenha" placeholder="Senha" required>
                <input type="file" id="regFoto" accept="image/*">
                <div id="regError" class="error-msg hidden"></div>
                <button type="submit" class="btn primary">Cadastrar</button>
            </form>
        </div>
    </div>
 
    <footer class="footer">
        <p>&copy; 2026-2027 SENAI Conecta</p>
    </footer>
 
    <script src="js/api.js?v=3"></script>
    <script src="js/posts.js?v=3"></script>
    <script src="js/auth.js?v=3"></script>
    <script src="js/search.js?v=3"></script>
    <script src="js/app.js?v=3"></script>
</body>
</html>
