<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>senai_conecta</title>

    <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
 
    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #1a2433;
      background: #f3f5f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
 
    /* Cabeçalho */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 24px;
      background: #004a8f;
      color: #fff;
    }
    .logo { font-weight: bold; font-size: 1.2rem; }
    .pesquisa { flex: 1; max-width: 360px; }
    .pesquisa input {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 20px;
      font-size: 0.95rem;
    }
    .btn-entrar {
      padding: 8px 18px;
      border: 2px solid #fff;
      border-radius: 6px;
      background: transparent;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-entrar:hover { background: #fff; color: #004a8f; }
 
    /* Conteúdo principal */
    main {
      flex: 1;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    main h1 { font-size: 1.4rem; margin-bottom: 16px; }
 
    /* Publicação */
    .publicacao {
      background: #fff;
      border: 1px solid #d5dbe3;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .autor {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .autor .nome { font-weight: bold; }
    .autor .username { color: #6b7686; font-size: 0.9rem; }
    .texto { margin-bottom: 12px; line-height: 1.5; }
    .imagem {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #e3e8ee;
      border: 1px dashed #9aa5b4;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7686;
      margin-bottom: 12px;
    }
    .curtir {
      background: none;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      color: #1a2433;
    }
 
    /* Rodapé */
    footer {
      padding: 16px;
      text-align: center;
      background: #004a8f;
      color: #fff;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

    <header>
        <div class="logo">SENAI Conecta</div>
        <form class="pesquisa" role="search" onsubmit="return false">
        <input type="search" placeholder="🔍 Pesquisa" aria-label="Pesquisa">
        </form>
        <button class="btn-entrar" type="button">ENTRAR</button>
    </header>



    <main>
        <h1>PUBLICAÇÕES</h1>
 
        <article class="publicacao">
        <div class="autor">
            <span aria-hidden="true">👤</span>
            <span class="nome">Usuário</span>
            <span class="username">@username</span>
        </div>
    
        <p class="texto">Texto da publicação...</p>
    
        <div class="imagem">[ EX IMAGEM ]</div>
    
        <button class="curtir" type="button">♡ 67</button>
        </article>
    </main>



    <footer>
        &copy; 2026-2027 SENAI Conecta
    </footer>

</body>
</html>
